<dialog #dialog aria-labelledby="confirm-dialog-header" (close)="onClose()">
  <header id="confirm-dialog-header">{{ header() }}</header>
  <p>{{ confirmation()?.message }}</p>
  <form method="dialog">
    <button type="submit" value="accept" class="button">Sí</button>
    @if (confirmation()?.rejectVisible !== false) {
      <!-- showModal() enfoca «No»: un segundo Enter o Espacio sobre «Comprar» no compra. -->
      <button type="submit" value="reject" class="secondary button" autofocus>No</button>
    }
  </form>
</dialog>
